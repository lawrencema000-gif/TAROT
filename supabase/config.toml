# Supabase CLI config for the TAROT project (ulzlthhkqjuohzjangcq).
#
# This file does not mirror the hosted project's Auth settings. `supabase
# config push` diffs the remote against the CLI's whole [auth] model, filling
# every field this file leaves out with the CLI's defaults; run it only
# interactively, read the whole printed diff, and answer no unless every line
# is intended. Never with --yes. It was never limited to the sections below.
#
# Auth settings held in the hosted project, not in this file:
#   - Leaked-password protection (HaveIBeenPwned): to be switched ON (p12
#     health-status-17, WP-P0-15; owner-list job 6) after the web build that
#     names the refusal is live, set with the dashboard switch or
#     PATCH /v1/projects/ulzlthhkqjuohzjangcq/config/auth {"password_hibp_enabled": true}.
#     CLI 2.77 has no config.toml key for it. Update this line with the date
#     it went on.
#   - Multi-factor sign-in: not offered (D11 A, 2026-11-17); the advisor's
#     auth_insufficient_mfa_options warning is accepted.
#   - Email confirmation at sign-up: off (mailer_autoconfirm = true; D11 A,
#     instant sign-up kept).
#   - Sign-in providers: email, Google, Apple.

project_id = "ulzlthhkqjuohzjangcq"

[auth]
# Production web site. Was previously stuck on localhost, which broke the
# Google OAuth return flow (Supabase refused to redirect back to tarotlife.app).
site_url = "https://tarotlife.app"

# Every URL the app might ask Supabase to redirect to after an auth event
# (OAuth callback, email confirmation, password reset, magic link). Must
# include native-app deep links and every locale variant the SPA uses.
additional_redirect_urls = [
  "https://tarotlife.app",
  "https://tarotlife.app/",
  "https://tarotlife.app/**",
  "https://tarotlife.app/?lang=en",
  "https://tarotlife.app/?lang=ja",
  "https://tarotlife.app/?lang=ko",
  "https://tarotlife.app/?lang=zh",
  # Netlify preview deploys (--alias=<name> builds) — allowed so audit /
  # smoke-test previews can complete Google OAuth. Wildcard covers every
  # alias name.
  "https://*--arcana-ritual-app.netlify.app",
  "https://*--arcana-ritual-app.netlify.app/**",
  "https://arcana-ritual-app.netlify.app",
  "https://arcana-ritual-app.netlify.app/**",
  "com.arcana.app://auth",
  "com.arcana.app://**",
]

[auth.email.template.confirmation]
subject = "Confirm your Arcana email / メールアドレスを確認 / 이메일 확인 / 确认您的电子邮箱"
content_path = "./supabase/email-templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your Arcana password / パスワードリセット / 비밀번호 재설정 / 重置密码"
content_path = "./supabase/email-templates/reset-password.html"

[auth.email.template.magic_link]
subject = "Your Arcana sign-in link / ログインリンク / 로그인 링크 / 登录链接"
content_path = "./supabase/email-templates/magic-link.html"

[auth.email.template.email_change]
subject = "Confirm your new Arcana email / 新しいメールアドレス確認 / 새 이메일 확인 / 确认新邮箱"
content_path = "./supabase/email-templates/change-email.html"

[auth.email.template.invite]
subject = "You're invited to Arcana / Arcanaへの招待 / Arcana 초대 / Arcana邀请"
content_path = "./supabase/email-templates/invite.html"

# Edge functions that must be reachable before a user signs in.
# The function bodies enforce their own rate limiting / validation.
[functions.ad-config]
verify_jwt = false

[functions.astrology-geocode]
verify_jwt = false

# Authenticated astrology endpoints: each function already calls
# supabase.auth.getUser(token) internally. The platform gateway's default
# verifier is HS256 only, but Supabase now issues ES256 user session tokens.
# Disabling platform verification lets the asymmetric tokens through; the
# function's internal getUser still enforces a real authenticated session.
[functions.astrology-daily]
verify_jwt = false

[functions.astrology-weekly]
verify_jwt = false

[functions.astrology-monthly]
verify_jwt = false

[functions.astrology-compute-natal]
verify_jwt = false

[functions.astrology-get-chart]
verify_jwt = false

[functions.astrology-transit-calendar]
verify_jwt = false

[functions.generate-reading]
verify_jwt = false

[functions.ad-events]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false

[functions.create-portal-session]
verify_jwt = false

[functions.send-welcome-email]
verify_jwt = false

[functions.daily-seo-blog-generator]
verify_jwt = false

[functions.daily-seo-boost]
verify_jwt = false

[functions.daily-seo-snapshot]
verify_jwt = false

[functions.daily-geo-mentions]
verify_jwt = false

[functions.daily-backlinks-snapshot]
