    <!-- Google Analytics + Google Ads.
         The gtag() queue is defined here, synchronously, so every call the
         app makes before the loader arrives is kept and replayed. The
         loader itself (190 KB) is appended after the window `load` event, in
         an idle slot: it used to be the first request after the document
         and owned the longest main-thread tasks on every page, ahead of the
         app's own entry chunk.
         The AW- (Google Ads) config is only issued where a conversion or a
         paid landing can happen — the auth routes, or a visit carrying a
         gclid / Google utm_source — because that config is what fires the
         remarketing pixel on every page view. Conversions themselves are
         GA4 events imported by Google Ads (see src/services/analytics.ts).
         AdSense is not here any more: src/components/ads/adsense.ts injects
         it the first time an ad component mounts, so the landing and the
         signed-in app never download it. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6V3H9HV31V');
      (function(){
        try {
          var p = location.pathname, q = location.search;
          if (/^\/(signup|signin)(\/|$)/.test(p) || /[?&](gclid|gbraid|wbraid)=/.test(q) || /[?&]utm_source=google\b/i.test(q)) {
            gtag('config', 'AW-18073938869');
          }
        } catch (e) {}
      })();
      (function(){
        function load(){
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-6V3H9HV31V';
          document.head.appendChild(s);
        }
        function idle(){
          if ('requestIdleCallback' in window) { requestIdleCallback(load, { timeout: 4000 }); }
          else { setTimeout(load, 1); }
        }
        if (document.readyState === 'complete') { idle(); }
        else { window.addEventListener('load', idle, { once: true }); }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- `maximum-scale=1.0, user-scalable=no` used to sit in here. Both are
         removed: they disable pinch-zoom for every user on every screen,
         which fails WCAG 1.4.4 (Resize Text) and is the single most common
         accessibility defect on Android wrappers. Android WebView and
         Chrome honour the lock; iOS Safari 10+ ignores it, so it was only
         ever punishing the platform we actually ship the store build to.
         The usual reason to add it — stopping the double-tap zoom that
         iOS does on small tap targets — is already handled by
         `touch-action: manipulation` on html in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Performance: preconnect to the domains we hit on first paint.
         Saves ~100-300ms per origin on TCP+TLS handshakes. dns-prefetch
         is the polite fallback for browsers that don't honor preconnect.
         The ad and analytics hosts are dns-prefetch only: neither is on the
         first paint any more. -->
    <link rel="preconnect" href="https://ulzlthhkqjuohzjangcq.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The two faces the first paint needs: the display serif for the
         greeting and the body sans. Everything else lazy-loads per
         unicode-range from the @font-face rules in index.css. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cormorant-garamond-latin-500-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin-400-normal.woff2" />
    <link rel="dns-prefetch" href="https://ulzlthhkqjuohzjangcq.supabase.co" />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
