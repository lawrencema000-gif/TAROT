name: Mail routing
# Every @tarotlife.app address the app publishes must receive mail (p12 health-status-01).
# GitHub emails the person who last edited this schedule when a scheduled run fails.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-mail-routing.mjs
