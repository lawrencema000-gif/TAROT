<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Ad: Daily Reading Compact Square 1080x1080</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .ad {
    width: 1080px; height: 1080px; position: relative;
    background: radial-gradient(ellipse at 50% 40%, rgba(212,168,83,0.07) 0%, transparent 50%),
                #040407;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; overflow: hidden; font-family: 'Inter', sans-serif;
    justify-content: center; gap: 0;
  }
  .noise { position: absolute; inset: 0; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 256px; }
  .star { position: absolute; width: 2px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 50%; }
  .star.gold { background: rgba(212,168,83,0.5); box-shadow: 0 0 6px rgba(212,168,83,0.3); }

  .brand {
    position: absolute; top: 40px;
    display: flex; align-items: center; gap: 8px;
    font-family: 'Cormorant Garamond', serif; font-size: 18px; color: #504c5e; z-index: 2;
  }
  .brand-moon { color: #d4a853; font-size: 20px; filter: drop-shadow(0 0 6px rgba(212,168,83,0.2)); }

  .your-reading {
    font-size: 14px; font-weight: 500; color: #706a82;
    letter-spacing: 0.03em; margin-bottom: 20px;
    position: relative; z-index: 2;
  }

  .card-area { position: relative; z-index: 2; margin-bottom: 28px; }
  .card-glow {
    position: absolute; inset: -30px; border-radius: 20px;
    background: radial-gradient(ellipse, rgba(212,168,83,0.1) 0%, transparent 70%);
  }
  .card-img {
    width: 260px; height: auto; border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,168,83,0.06);
    position: relative; z-index: 1;
  }

  .card-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 48px; font-weight: 600; color: #eae6f2;
    margin-bottom: 4px; position: relative; z-index: 2;
  }
  .card-keyword {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px; color: #d4a853; font-style: italic;
    margin-bottom: 16px; position: relative; z-index: 2;
  }
  .card-desc {
    font-size: 15px; color: #8a849a; line-height: 1.55;
    max-width: 480px; margin-bottom: 28px; position: relative; z-index: 2;
    padding: 0 40px;
  }
  .card-desc strong { color: #d4a853; font-weight: 500; }

  .cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 34px; border-radius: 14px;
    background: linear-gradient(135deg, #d4a853, #e8c97a);
    color: #080808; font-weight: 600; font-size: 15px;
    box-shadow: 0 4px 24px rgba(212,168,83,0.25);
    position: relative; z-index: 2;
  }
  .cta svg { width: 13px; height: 13px; }

  .bottom-text {
    position: absolute; bottom: 36px;
    font-size: 12px; color: #3e3a4d; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="noise"></div>
  <div class="star" style="left:6%;top:6%"></div><div class="star gold" style="left:20%;top:10%"></div>
  <div class="star" style="left:80%;top:8%"></div><div class="star gold" style="left:92%;top:20%"></div>
  <div class="star" style="left:5%;top:88%"></div><div class="star gold" style="left:50%;top:95%"></div>
  <div class="star" style="left:88%;top:85%"></div><div class="star" style="left:35%;top:4%"></div>
  <div class="star gold" style="left:12%;top:65%"></div><div class="star" style="left:90%;top:55%"></div>

  <div class="brand"><span class="brand-moon">☽</span> Arcana</div>

  <div class="your-reading">Your daily reading is...</div>

  <div class="card-area">
    <div class="card-glow"></div>
    <img class="card-img" src="the-sun-original.png" alt="The Sun">
  </div>

  <div class="card-name">The Sun</div>
  <div class="card-keyword">Joy · Success · Vitality</div>
  <div class="card-desc">
    A bright, positive day awaits. <strong>The Sun</strong> brings clarity, warmth, and confidence. Good things are coming your way.
  </div>
  <div class="cta">Download the app for more <svg viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="bottom-text">Free on Google Play</div>
</div>
</body></html>
