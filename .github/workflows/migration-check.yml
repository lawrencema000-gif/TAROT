name: Supabase migration drift check

# Fails if someone has added/changed tables directly in the Supabase dashboard
# without a corresponding migration file checked into git. Runs on PRs that
# touch supabase/migrations/**.
#
# Also guards against the opposite: migrations committed to git that haven't
# been applied yet to the linked project.
#
# Secrets required (same as deploy.yml):
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_PROJECT_ID
#   - SUPABASE_DB_PASSWORD

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  # Nightly sanity run even if nothing changed, catches drift from dashboard edits.
  schedule:
    - cron: '0 6 * * *'
  # Manual run, for the release check after a migration repair.
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.77.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
                       --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Check migration list matches remote
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # supabase migration list prints a diff between local files and
          # remote migration history. We fail the job if any local migration
          # isn't applied (new changes coming in via this PR) — that's fine
          # because deploy.yml will apply them on main. But we also fail if
          # the REMOTE has migrations the local tree doesn't know about,
          # which indicates someone bypassed git.
          supabase migration list --linked | tee /tmp/migration-list.txt
          if grep -q "Remote migrations not found locally" /tmp/migration-list.txt; then
            echo "::error::Remote has migrations missing from git. Someone edited the DB outside of source control."
            exit 1
          fi

      - name: Schema diff (detects drift in tables edited via dashboard)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # db diff builds a shadow database from supabase/migrations and
          # compares the live schema with it. Empty diff = clean.
          # If the shadow database cannot be built, the migrations no longer
          # replay and the diff proves nothing: fail loudly (WP-F-04). Never
          # swallow this error again.
          if ! supabase db diff --linked --schema public > /tmp/schema-diff.sql; then
            echo "::error::Could not build the shadow database from supabase/migrations: the migrations no longer replay. Fix the replay (see WP-F-04) before trusting this check."
            exit 1
          fi
          if [ -s /tmp/schema-diff.sql ]; then
            cat /tmp/schema-diff.sql
            if [ "${{ github.event_name }}" = "schedule" ]; then
              # The nightly run is the one that must notice production-only
              # changes: drift fails it, with the diff above in the log.
              echo "::error::Schema drift between the live database and supabase/migrations (diff above)."
              exit 1
            fi
            # On a pull request or push a migration may be merged but not yet
            # pushed to production, so drift is a warning there.
            echo "::warning::Schema drift detected between live DB and local migrations (diff above)."
          else
            echo "✓ No schema drift detected."
          fi
